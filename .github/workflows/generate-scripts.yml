name: Generate Scripts List

on:
  push:
    paths:
      - "scripts/**"
      - "current-script.txt"
      - "tools/build_scripts.py"
      - ".github/workflows/generate-scripts.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pillow
          command -v pdftoppm || (sudo apt-get update && sudo apt-get install -y poppler-utils)

      - name: Generate scripts.json and thumbnails
        run: python tools/build_scripts.py

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/scripts.json data/thumbs data/characters.json

          git diff --cached --quiet || (
            git commit -m "Auto-generate scripts.json"
            git push
          )
